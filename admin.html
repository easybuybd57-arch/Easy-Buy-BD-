<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Easy Buy BD Admin</title>
<style>
body{font-family:Arial,sans-serif;background:#f1f5f9;margin:0;padding:15px}
.box{max-width:500px;margin:20px auto;background:white;padding:20px;border-radius:14px;box-shadow:0 3px 15px #ddd}
h2{text-align:center;color:#087b45}
input,select,button{width:100%;padding:13px;margin:7px 0;box-sizing:border-box;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{background:#087b45;color:white;border:0;font-weight:bold}
.delete{background:#dc2626}
.item{border:1px solid #ddd;padding:12px;margin:10px 0;border-radius:9px}
.item img{width:75px;height:75px;object-fit:cover;border-radius:8px}
.hidden{display:none}
#preview{max-width:150px;max-height:150px;display:none;margin:10px auto}
</style>
</head>
<body>
<div class="box">
<h2>🛒 Easy Buy BD Admin</h2>
<div id="login">
<h3>Admin Login</h3>
<input id="email" type="email" placeholder="আপনার ইমেইল">
<input id="password" type="password" placeholder="পাসওয়ার্ড">
<button id="loginBtn">Login</button>
<p id="message"></p>
</div>

<div id="panel" class="hidden">
<h3>📞 WhatsApp নম্বর সেটিংস</h3>
<div class="item">
 <label for="whatsappNumber">অর্ডার নেওয়ার WhatsApp নম্বর</label>
 <input id="whatsappNumber" type="tel" inputmode="numeric" placeholder="01705511676" value="01705511676">
 <button id="saveWhatsappBtn" type="button">WhatsApp নম্বর Save করুন</button>
 <p id="whatsappStatus" role="status"></p>
</div>
<h3>নতুন পণ্য যোগ করুন</h3>
<input id="name" placeholder="পণ্যের নাম">
<input id="price" type="number" placeholder="পণ্যের দাম">
<select id="category">
<option>ইলেকট্রনিক্স</option>
<option>ফ্যাশন</option>
<option>ঘর</option>
<option>অন্যান্য</option>
</select>
<input id="emoji" placeholder="ইমোজি" value="🛍️">
<label>গ্যালারি থেকে পণ্যের ছবি নির্বাচন করুন</label>
<input id="photo" type="file" accept="image/*">
<img id="preview" alt="ছবির প্রিভিউ">
<button id="addBtn">পণ্য যোগ করুন</button>

<hr>
<h3>🖼️ হোমপেজ ব্যানার পরিচালনা</h3>
<label>গ্যালারি থেকে ব্যানার ছবি নির্বাচন করুন</label>
<input id="bannerPhoto" type="file" accept="image/*">
<img id="bannerPreview" alt="ব্যানার প্রিভিউ" style="width:100%;display:none;margin:10px 0;border-radius:8px">
<button id="addBannerBtn">ব্যানার যোগ করুন</button>
<p id="bannerStatus"></p>
<h3>আপনার ব্যানারসমূহ</h3>
<div id="bannerList">লোড হচ্ছে...</div>

<button id="logoutBtn" style="background:#475569">Logout</button>
<p id="status"></p>
<hr>
<h3>আপনার পণ্যসমূহ</h3>
<div id="list">লোড হচ্ছে...</div>
</div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,setPersistence,inMemoryPersistence} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getFirestore,collection,addDoc,getDocs,deleteDoc,doc,getDoc,setDoc} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyBL_17lHmW4pD4qpfROgjh5zz0ELHqPSIw",
authDomain:"easy-buy-bd-ef147.firebaseapp.com",
projectId:"easy-buy-bd-ef147",
storageBucket:"easy-buy-bd-ef147.firebasestorage.app",
messagingSenderId:"246521445162",
appId:"1:246521445162:web:d21e43015352ec008d7c53"
};

const ADMIN_UID="idWU2lGPmleyQW2L1ExB45IiIz02";
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
await setPersistence(auth,inMemoryPersistence);
const db=getFirestore(app);
const $=id=>document.getElementById(id);

$("photo").onchange=()=>{
const file=$("photo").files[0];
if(!file)return;
if(!file.type.startsWith("image/")){
$("status").innerText="সঠিক ছবি নির্বাচন করুন";
return;
}
const reader=new FileReader();
reader.onload=()=>{
$("preview").src=reader.result;
$("preview").style.display="block";
};
reader.readAsDataURL(file);
};

function resizeImage(file){
return new Promise((resolve,reject)=>{
const reader=new FileReader();
reader.onerror=reject;
reader.onload=()=>{
const img=new Image();
img.onerror=reject;
img.onload=()=>{
const max=800;
const scale=Math.min(1,max/Math.max(img.width,img.height));
const canvas=document.createElement("canvas");
canvas.width=Math.round(img.width*scale);
canvas.height=Math.round(img.height*scale);
canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
resolve(canvas.toDataURL("image/jpeg",0.65));
};
img.src=reader.result;
};
reader.readAsDataURL(file);
});
}

$("loginBtn").onclick=async()=>{
$("message").innerText="লগইন হচ্ছে...";
try{
await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);
}catch(e){
$("message").innerText="লগইন হয়নি: "+e.message;
}
};

onAuthStateChanged(auth,user=>{
if(user && user.uid===ADMIN_UID){
$("login").classList.add("hidden");
$("panel").classList.remove("hidden");
loadProducts();
loadBanners();
loadWhatsappSetting();
}else{
$("panel").classList.add("hidden");
$("login").classList.remove("hidden");
if(user)signOut(auth);
}
});

$("logoutBtn").onclick=()=>signOut(auth);

async function loadWhatsappSetting(){
 try{
  const snap=await getDoc(doc(db,"settings","contact"));
  if(snap.exists()&&snap.data().whatsappNumber){
   $("whatsappNumber").value=snap.data().whatsappNumber;
  }
 }catch(e){
  $("whatsappStatus").innerText="নম্বর লোড হয়নি: "+e.message;
 }
}
$("saveWhatsappBtn").onclick=async()=>{
 const number=$("whatsappNumber").value.trim().replace(/[\\s()+-]/g,"");
 if(!/^01[3-9]\\d{8}$/.test(number)){
  $("whatsappStatus").innerText="সঠিক ১১ সংখ্যার বাংলাদেশি মোবাইল নম্বর দিন";
  return;
 }
 $("saveWhatsappBtn").disabled=true;
 $("whatsappStatus").innerText="নম্বর Save হচ্ছে...";
 try{
  await setDoc(doc(db,"settings","contact"),{whatsappNumber:number,updatedAt:Date.now()},{merge:true});
  $("whatsappStatus").innerText="নম্বর সফলভাবে Save হয়েছে। ওয়েবসাইটে স্বয়ংক্রিয়ভাবে আপডেট হবে।";
 }catch(e){
  $("whatsappStatus").innerText="Save হয়নি: "+e.message;
 }
 $("saveWhatsappBtn").disabled=false;
};


$("addBtn").onclick=async()=>{
const name=$("name").value.trim();
const price=Number($("price").value);
const file=$("photo").files[0];
if(!name||price<=0){
$("status").innerText="পণ্যের নাম ও সঠিক দাম দিন";
return;
}
$("addBtn").disabled=true;
$("status").innerText="পণ্য যোগ হচ্ছে...";
try{
let image="";
if(file){
image=await resizeImage(file);
if(image.length>850000){
throw new Error("ছবিটি অনেক বড়। ছোট ছবি নির্বাচন করুন।");
}
}
await addDoc(collection(db,"products"),{
name,price,category:$("category").value,
emoji:$("emoji").value.trim()||"🛍️",
image
});
$("name").value="";
$("price").value="";
$("photo").value="";
$("preview").style.display="none";
$("status").innerText="পণ্য সফলভাবে যোগ হয়েছে!";
loadProducts();
}catch(e){
$("status").innerText="সমস্যা: "+e.message;
}
$("addBtn").disabled=false;
};


// Banner image preview
$("bannerPhoto").onchange=()=>{
 const file=$("bannerPhoto").files[0];
 if(!file)return;
 if(!file.type.startsWith("image/")){
  $("bannerStatus").innerText="সঠিক ছবি নির্বাচন করুন";
  return;
 }
 const reader=new FileReader();
 reader.onload=()=>{
  $("bannerPreview").src=reader.result;
  $("bannerPreview").style.display="block";
 };
 reader.readAsDataURL(file);
};

function resizeBanner(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onerror=reject;
  reader.onload=()=>{
   const img=new Image();
   img.onerror=reject;
   img.onload=()=>{
    const max=1400;
    const scale=Math.min(1,max/Math.max(img.width,img.height));
    const canvas=document.createElement("canvas");
    canvas.width=Math.round(img.width*scale);
    canvas.height=Math.round(img.height*scale);
    canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
    resolve(canvas.toDataURL("image/jpeg",0.7));
   };
   img.src=reader.result;
  };
  reader.readAsDataURL(file);
 });
}

$("addBannerBtn").onclick=async()=>{
 const file=$("bannerPhoto").files[0];
 if(!file){
  $("bannerStatus").innerText="আগে একটি ব্যানার ছবি নির্বাচন করুন";
  return;
 }
 $("addBannerBtn").disabled=true;
 $("bannerStatus").innerText="ব্যানার আপলোড হচ্ছে...";
 try{
  const image=await resizeBanner(file);
  if(image.length>850000)throw new Error("ছবিটি অনেক বড়। ছোট ছবি নির্বাচন করুন।");
  await addDoc(collection(db,"banners"),{
   image,
   createdAt:Date.now()
  });
  $("bannerPhoto").value="";
  $("bannerPreview").style.display="none";
  $("bannerStatus").innerText="ব্যানার সফলভাবে যোগ হয়েছে!";
  loadBanners();
 }catch(e){
  $("bannerStatus").innerText="সমস্যা: "+e.message;
 }
 $("addBannerBtn").disabled=false;
};

async function loadBanners(){
 $("bannerList").innerText="লোড হচ্ছে...";
 try{
  const snap=await getDocs(collection(db,"banners"));
  $("bannerList").innerHTML="";
  snap.forEach(d=>{
   const b=d.data();
   const div=document.createElement("div");
   div.className="item";
   if(b.image){
    const img=document.createElement("img");
    img.src=b.image;
    img.style.width="100%";
    img.style.height="auto";
    div.append(img);
   }
   const del=document.createElement("button");
   del.textContent="ব্যানার মুছুন";
   del.className="delete";
   del.onclick=async()=>{
    if(confirm("এই ব্যানারটি মুছে ফেলবেন?")){
     try{
      await deleteDoc(doc(db,"banners",d.id));
      loadBanners();
     }catch(e){
      $("bannerStatus").innerText="মুছতে সমস্যা: "+e.message;
     }
    }
   };
   div.append(del);
   $("bannerList").append(div);
  });
  if(snap.empty)$("bannerList").innerText="এখনো কোনো ব্যানার নেই";
 }catch(e){
  $("bannerList").innerText="ব্যানার লোড হয়নি: "+e.message;
 }
}

async function loadProducts(){
$("list").innerText="লোড হচ্ছে...";
try{
const snap=await getDocs(collection(db,"products"));
$("list").innerHTML="";
snap.forEach(d=>{
const p=d.data();
const div=document.createElement("div");
div.className="item";
if(p.image){
const img=document.createElement("img");
img.src=p.image;
div.append(img);
}
const title=document.createElement("b");
title.textContent=p.name+" — ৳"+p.price;
const del=document.createElement("button");
del.textContent="পণ্য মুছুন";
del.className="delete";
del.onclick=async()=>{
if(confirm("পণ্যটি মুছে ফেলবেন?")){
await deleteDoc(doc(db,"products",d.id));
loadProducts();
}
};
div.append(title,del);
$("list").append(div);
});
if(snap.empty)$("list").innerText="এখনো কোনো পণ্য নেই";
}catch(e){
$("list").innerText="পণ্য লোড হয়নি: "+e.message;
}
}
</script>
</body>
</html>
